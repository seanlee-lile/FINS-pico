plugins { id 'com.android.application' }
def localTools = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localTools.load(it) }
}
android {
    namespace 'com.iwin.application'
    compileSdk 35
    defaultConfig {
        applicationId 'com.iwin.application.xr'
        minSdk 29
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra'; arguments '-DANDROID_STL=c++_shared' } }
        targetSdk 35
        versionCode 6
        versionName '0.4.2-xr'
    }
    ndkVersion '27.2.12479018'
    if (localTools.getProperty('iwin.ndkPath')) { ndkPath localTools.getProperty('iwin.ndkPath') }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'native/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main { java.srcDirs = ['src']; manifest.srcFile 'src/AndroidManifest.xml' }
    // 源码平铺在 src 下，目录不再对应包名；lint 会误报清单中的 MainActivity 不存在。
    lint { disable 'MissingClass' }
}
dependencies {
    implementation project(':communication')
    implementation project(':input')
    implementation 'androidx.media3:media3-common:1.5.1'
}

dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49' }
